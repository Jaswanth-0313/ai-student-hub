services:
  - type: web
    name: ai-student-hub
    env: node
    plan: free
    # frontend/dist is pre-built and committed to git.
    # Render only needs to install backend dependencies.
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
    # Set these in the Render dashboard (never commit secrets):
    # MONGO_URI, JWT_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
    # GOOGLE_CALLBACK_URL, FRONTEND_URL, CORS_ORIGIN
