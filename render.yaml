services:
  - type: web
    name: ai-student-hub
    env: node
    plan: free
    # Build command runs build.sh which installs deps and builds the Vite frontend
    buildCommand: bash build.sh
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
    # Set these in the Render dashboard (never commit secrets):
    # MONGO_URI, JWT_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
    # GOOGLE_CALLBACK_URL, FRONTEND_URL, CORS_ORIGIN
